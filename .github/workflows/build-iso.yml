name: build-iso

# Lints the profile on every push, and builds the ISO only when ASKED.
#
# It used to build on every push to main, and that stopped being worth it once
# the numbers were looked at (2026-08-25). The build is ~12 min of mkarchiso, of
# which only ~2.4 min is pacstrap — the rest is squashfs zstd -19, i.e. CPU. A
# 4-vCPU runner is the worst machine in the room for that: the maintainer's box
# does the same work several times faster, off a warm pacman cache, and lands the
# image where the VM harness can boot it instead of inside a 2.2 GB artifact.
#
# The "clean Arch" argument that put it here does not survive contact with the
# profile either: `profiledef.sh` sets `pacman_conf="pacman.conf"`, so the
# airootfs is pacstrapped from the PROFILE's repo list (Arch + [nidara]). What
# the host contributes is the mkarchiso binary and a keyring — not its packages.
#
# `lint` still runs on every push, and it is the half that pays: it costs seconds
# and catches the syntax error that would otherwise die twelve minutes into a
# container. `build` stays available on demand (workflow_dispatch) as a
# clean-room second opinion when a local build does something suspicious.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One build at a time per ref. A cancelled mkarchiso leaves mounts behind, and
# the runner is thrown away anyway — but a queued second build on the same ref
# would just burn twenty minutes to produce the same image.
concurrency:
  group: nidara-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        # Cheap gate that fails in seconds instead of twenty minutes: every
        # script in this repo has to at least parse. profiledef.sh is sourced by
        # mkarchiso, so a typo there dies AFTER the container is up.
        run: |
          set -e
          for f in build.sh profile/profiledef.sh profile/airootfs/usr/local/bin/*; do
            echo "  bash -n $f"; bash -n "$f"
          done
      - name: The live setup script must not reimplement nidara-setup
        # nidara-setup owns greetd, /etc/environment, the per-user seeds and the
        # services. The live script is allowed to WRITE the autologin config
        # (step 5, deliberately after nidara-setup runs) but must not start
        # enabling services or seeding config on its own — that is the drift
        # this repo is one `systemctl enable` away from.
        run: |
          if grep -nE '^\s*systemctl (enable|disable)' profile/airootfs/usr/local/bin/nidara-live-setup; then
            echo "::error::nidara-live-setup enables services — that is nidara-setup's job"
            exit 1
          fi

      - name: The image must answer everything systemd-firstboot would ask
        # systemd-firstboot runs on every boot of this medium — mkarchiso writes
        # /etc/machine-id as "uninitialized", which is exactly what
        # ConditionFirstBoot=yes tests. It then prompts, ON THE CONSOLE AND
        # BEFORE ANY DESKTOP, for each setting it cannot find already made. A
        # forgotten file here does not degrade anything: it hangs the boot at a
        # text prompt nobody can answer from a live USB they just plugged in.
        #
        # Found the hard way: /etc/localtime was missing and the first ISO ever
        # built stopped at "configure timezone" instead of reaching the desktop.
        # --prompt-keymap-auto derives the keymap from the locale and never
        # prompts, which is why /etc/vconsole.conf is not on this list (releng
        # ships no such file either).
        run: |
          set -e
          missing=0
          for f in localtime locale.conf hostname passwd shadow; do
            if [ ! -e "profile/airootfs/etc/$f" ]; then
              echo "::error::profile/airootfs/etc/$f is missing — systemd-firstboot will prompt for it and the boot will stop there"
              missing=1
            fi
          done
          exit $missing

  build:
    # ON DEMAND ONLY — see the header. Images are built locally now (README,
    # "Building"); this is the clean-room second opinion, not the factory.
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
      # mkarchiso mounts tmpfs, loop-mounts images and runs pacstrap in a
      # chroot. None of that works in the default container sandbox.
      options: --privileged
    steps:
      - name: Bootstrap
        # -Syu, never a bare -Sy: archlinux:latest moves, and a partial sync
        # mismatches sonames (same rule as install.sh and nidara-repo's CI).
        run: pacman -Syu --needed --noconfirm archiso git

      - uses: actions/checkout@v4

      - name: Build the ISO
        run: ./build.sh -o "$GITHUB_WORKSPACE/out" -w /tmp/archiso-work

      - name: Report what came out
        # The number that decides whether this image can ship as a GitHub
        # release asset at all (2 GiB per file), printed where a failed build
        # can still be compared against a passing one.
        run: |
          ls -lh out/
          du -b out/*.iso | awk '{printf "ISO size: %.2f GiB (%d bytes)\n", $1/1073741824, $1}'

      - uses: actions/upload-artifact@v4
        with:
          name: nidara-iso
          path: out/*.iso
          retention-days: 7
          compression-level: 0   # an ISO is already compressed
