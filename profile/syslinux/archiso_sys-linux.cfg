LABEL nidara
TEXT HELP
Start the Nidara live desktop. Nothing is written to disk until you install.
Log in is automatic; the password for `sudo` and for the lock screen is: nidara
ENDTEXT
MENU LABEL Nidara live desktop (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0

LABEL nidaraverbose
TEXT HELP
Same, but with the kernel and systemd messages on screen.
Use this if the quiet boot ends in a black screen and you need to see why.
ENDTEXT
MENU LABEL Nidara live desktop (%ARCH%, BIOS) with ^verbose boot
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
